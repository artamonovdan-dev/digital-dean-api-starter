[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-dean-api"
version = "0.2.0"
description = "Навчальний API інформаційної системи «Цифровий деканат»"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic[email]>=2.7",
    "uvicorn[standard]>=0.30",
    "cryptography==48.0.1",
    "pycryptodome==3.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
